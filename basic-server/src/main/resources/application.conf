ktor {
    development = true
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ io.github.wlara.ktor.server.examples.basic.ApplicationKt.module ]
    }
}

users {
    maxNameLength = 64
    maxEmailLength = 64
}

products {
    sortNewestFirst = false
}
